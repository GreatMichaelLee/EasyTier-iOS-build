# The only workflow of the public GreatMichaelLee/EasyTier-iOS-build repository
# (a public repository builds on GitHub's macOS runners for free). Same model as
# HomeLink's iOS build: the source stays private -- it is checked out from the
# private source repository with a read-only deploy key -- and nothing readable
# leaves the runner: the build log and the IPA are uploaded encrypted with
# ARTIFACT_KEY (scripts/release/ios-build.sh on the build box decrypts them).
# Started only by hand (workflow_dispatch needs write access to this repository).
name: EasyTier iOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit of the private source repository to build
        required: true
      build:
        description: the build number (NNN, allocated by the build box), shown as -Build NNN
        required: true
      release:
        description: "true for a release build (no D suffix); anything else is a dev build shown as -Build NNND"
        required: false
        default: "false"

      tests_only:
        description: "true to run simulator tests without building an IPA"
        required: false
        default: "false"

      build_only:
        description: "true to build an IPA without the full simulator test job"
        required: false
        default: "false"

      core_startup_only:
        description: "true to execute only the isolated Apple core startup test"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

env:
  SOURCE_REPO: GreatMichaelLee/Easytier-iOS-src
  CORE_REPO: GreatMichaelLee/Easytier
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  TEAM_ID: Z78N6GQ84P

jobs:
  ipa:
    if: ${{ inputs.tests_only != 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      # Everything below that can quote source lines or paths (compiler and
      # cargo messages) writes to the log file only; the public step log shows
      # nothing but "ok"/"failed".
      - name: Build
        env:
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          BUILD_NUM: ${{ inputs.build }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/build.log"
          (
            set -euo pipefail
            printf -v BUILD_NUM_PADDED '%03d' "$((10#$BUILD_NUM))"
            DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)
            HASH=$(git rev-parse --short=8 HEAD)
            SUFFIX=D; [ "$IS_RELEASE" = true ] && SUFFIX=
            BUILD_VERSION="${DATE}-${HASH}-Build ${BUILD_NUM_PADDED}${SUFFIX}"
            FILE_VERSION="${BUILD_VERSION// /}"
            IPA_NAME="easytier-iphone-${FILE_VERSION}.ipa"
            echo "version: ${BUILD_VERSION}"

            # cargo pulls the private core repository over a second read-only deploy key
            mkdir -p ~/.ssh
            install -m 600 /dev/null ~/.ssh/core_ci_key
            printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_ci_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            printf 'Host github.com-easytier-core\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/core_ci_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
            git config --global url."git@github.com-easytier-core:${CORE_REPO}.git".insteadOf "https://github.com/${CORE_REPO}.git"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true

            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            xcodebuild -version
            rustup target add aarch64-apple-ios
            command -v protoc >/dev/null 2>&1 || brew install protobuf

            ARCHIVE_PATH="$RUNNER_TEMP/EasyTier.xcarchive"
            xcodebuild archive \
              -project EasyTier.xcodeproj -scheme "$SCHEME" -configuration "$BUILD_CONFIGURATION" \
              -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_VERSION"

            PKG="$RUNNER_TEMP/package"; OUT="$RUNNER_TEMP/export"
            mkdir -p "$PKG/Payload" "$OUT"
            cp -R "$ARCHIVE_PATH/Products/Applications/EasyTier.app" "$PKG/Payload/EasyTier.app"
            (cd "$PKG" && /usr/bin/zip -qry "$OUT/$IPA_NAME" Payload)
            (cd "$OUT" && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          ) > "$LOG" 2>&1
          BUILD_RC=$?
          echo "rc=$BUILD_RC" >> "$LOG"
          grep -q '^rc=0$' "$LOG" && echo "build ok" || echo "build failed (see the encrypted log)"
          exit "$BUILD_RC"

      - name: Encrypt
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          mkdir -p "$RUNNER_TEMP/out"
          enc() { "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in "$1" -out "$RUNNER_TEMP/out/$(basename "$1").enc"; }
          [ -f "$RUNNER_TEMP/build.log" ] && enc "$RUNNER_TEMP/build.log"
          for f in "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP"/export/*.sha256; do [ -f "$f" ] && enc "$f"; done
          # names only: the public log must not show anything else
          ls "$RUNNER_TEMP/out" | sed 's/.*/artifact: &/' | sed -E 's/easytier-iphone-[^.]*/easytier-iphone-<version>/'
          # the job fails when there is no IPA, after the log is safely encrypted
          ls "$RUNNER_TEMP"/export/*.ipa >/dev/null 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easytier-ios-encrypted
          path: ${{ runner.temp }}/out/
          retention-days: 3

  tests:
    if: ${{ inputs.build_only != 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      # Unit tests (XCTest, hosted by the app on an iPhone simulator) and a UI smoke
      # (launch the app on each tab in light and dark mode and screenshot it). Same
      # rule as the build job: everything readable goes to files, the public log
      # shows counts and "ok"/"failed" only.
      - name: Test
        env:
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          CORE_STARTUP_ONLY: ${{ inputs.core_startup_only }}
        run: |
          set +e
          OUTDIR="$RUNNER_TEMP/tests-out"; mkdir -p "$OUTDIR/shots"
          LOG="$OUTDIR/tests.log"
          (
            set -euo pipefail
            mkdir -p ~/.ssh
            install -m 600 /dev/null ~/.ssh/core_ci_key
            printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_ci_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            printf 'Host github.com-easytier-core\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/core_ci_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
            git config --global url."git@github.com-easytier-core:${CORE_REPO}.git".insteadOf "https://github.com/${CORE_REPO}.git"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true

            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            rustup target add aarch64-apple-ios-sim
            command -v protoc >/dev/null 2>&1 || brew install protobuf

            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and x['isAvailable']]
          print(c[-1]['udid'] if c else '')")
            echo "simulator: $UDID"
            [ -n "$UDID" ] || { echo "no iPhone simulator"; exit 3; }
            xcrun simctl boot "$UDID" || true

            # bindgen (kcp-sys) cannot parse the Rust triple "aarch64-apple-ios-sim"; hand clang the real one
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim="--target=arm64-apple-ios16.0-simulator --sysroot=$(xcrun --sdk iphonesimulator --show-sdk-path)"
            DD="$RUNNER_TEMP/dd"
            TEST_COMMAND=(xcodebuild test)
            if [ "$CORE_STARTUP_ONLY" = true ]; then
              TEST_COMMAND+=(-only-testing:EasyTierTests/CoreStartupTests/testIsolatedAppleCoreStartsAfterRejectedConfigurationAndStops)
            fi
            set +e
            "${TEST_COMMAND[@]}" -project EasyTier.xcodeproj -scheme "$SCHEME" \
              -destination "id=$UDID" -derivedDataPath "$DD" \
              -resultBundlePath "$OUTDIR/tests.xcresult" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="$TEAM_ID"
            XCODE_TEST_RC=$?
            set -e
            echo "xcodebuild test rc=$XCODE_TEST_RC"
            # A cancelled build cannot execute sanitizer tests. Preserve its
            # diagnostics and avoid recompiling the same invalid Swift source.
            if [ "$XCODE_TEST_RC" -ne 0 ] && grep -q 'Testing cancelled because the build failed.' "$LOG"; then
              xcrun xcresulttool get test-results summary --path "$OUTDIR/tests.xcresult" > "$OUTDIR/summary.json" 2>&1 || true
              xcrun xcresulttool get test-results tests --path "$OUTDIR/tests.xcresult" > "$OUTDIR/tests.json" 2>&1 || true
              xcrun xcresulttool export diagnostics --path "$OUTDIR/tests.xcresult" --output-path "$OUTDIR/diagnostics" > "$OUTDIR/diagnostics-export.log" 2>&1 || true
              echo "build failed before tests; sanitizer repetition skipped"
              exit "$XCODE_TEST_RC"
            fi

            xcrun xcresulttool get test-results summary --path "$OUTDIR/tests.xcresult" > "$OUTDIR/summary.json" 2>&1
            xcrun xcresulttool get test-results tests --path "$OUTDIR/tests.xcresult" > "$OUTDIR/tests.json" 2>&1

            if [ "$CORE_STARTUP_ONLY" = true ]; then
              xcrun xcresulttool export diagnostics --path "$OUTDIR/tests.xcresult" --output-path "$OUTDIR/diagnostics" > "$OUTDIR/diagnostics-export.log" 2>&1 || true
              exit "$XCODE_TEST_RC"
            fi

            # Regression for the previous DNS invalid-free crash: retain the
            # original test and repeat under ASan in a separate result bundle.
            set +e
            xcodebuild test -project EasyTier.xcodeproj -scheme "$SCHEME" \
              -destination "id=$UDID" -derivedDataPath "$DD" \
              -resultBundlePath "$OUTDIR/dns-asan.xcresult" \
              -only-testing:EasyTierTests/DnsLogTests/testSingleOversizedEntryIsNotRetained \
              -only-testing:EasyTierTests/DnsLogTests/testStoreDeallocatesSynchronouslyInsideTaskLocalScope \
              -only-testing:EasyTierTests/ProfileDocumentTests/testQueuedSaveWritesSubmittedSnapshotWithoutConsumingLaterDraft \
              -test-iterations 5 -enableAddressSanitizer YES \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="$TEAM_ID"
            ASAN_RC=$?
            set -e
            echo "dns ASan regression rc=$ASAN_RC"
            xcrun xcresulttool get test-results summary --path "$OUTDIR/dns-asan.xcresult" > "$OUTDIR/dns-asan-summary.json" 2>&1 || true
            xcrun xcresulttool export diagnostics --path "$OUTDIR/tests.xcresult" --output-path "$OUTDIR/diagnostics" > "$OUTDIR/diagnostics-export.log" 2>&1 || true
            [ "$ASAN_RC" -eq 0 ] || exit "$ASAN_RC"
            [ "$XCODE_TEST_RC" -eq 0 ] || exit "$XCODE_TEST_RC"
            APP="$DD/Build/Products/Debug-iphonesimulator/EasyTier.app"
            if [ -d "$APP" ]; then
              xcrun simctl install "$UDID" "$APP"
              BID=app.turquoise1634.pearl6659
              for mode in light dark; do
                xcrun simctl ui "$UDID" appearance "$mode"
                for tab in 0 1 2 3; do
                  xcrun simctl launch --terminate-running-process "$UDID" "$BID" -uitest-tab "$tab"
                  sleep 5
                  xcrun simctl io "$UDID" screenshot "$OUTDIR/shots/tab$tab-$mode.png"
                done
              done
              xcrun simctl terminate "$UDID" "$BID" || true
            else
              echo "no simulator app at $APP"
              exit 4
            fi
          ) > "$LOG" 2>&1
          TEST_RC=$?
          mkdir -p "$OUTDIR/crashes"
          for report in "$HOME"/Library/Logs/DiagnosticReports/EasyTier*.ips "$HOME"/Library/Logs/DiagnosticReports/EasyTier*.crash "$HOME"/Library/Logs/DiagnosticReports/Retired/EasyTier*.ips; do
            [ ! -f "$report" ] || cp "$report" "$OUTDIR/crashes/"
          done
          echo "test pipeline rc=$TEST_RC" >> "$LOG"
          python3 - "$OUTDIR/summary.json" > "$OUTDIR/counts.txt" 2>&1 <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print("passed=%s failed=%s skipped=%s total=%s" % (d.get("passedTests"),d.get("failedTests"),d.get("skippedTests"),d.get("totalTestCount")))
          except Exception as e:
              print("passed=? failed=? (%s)" % e)
          PY
          cat "$OUTDIR/counts.txt"
          grep -q 'xcodebuild test rc=0' "$LOG" && echo "tests ok" || echo "tests failed (see the encrypted log)"
          ls "$OUTDIR/shots" | wc -l | sed 's/^ *//; s/$/ screenshots/'
          [ "$TEST_RC" -eq 0 ] || exit "$TEST_RC"
          python3 - "$OUTDIR/summary.json" "$CORE_STARTUP_ONLY" "$OUTDIR/tests.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              d = json.load(f)
          assert d.get("totalTestCount", 0) > 0, "No tests executed"
          assert d.get("passedTests", 0) > 0, "No tests passed"
          assert d.get("failedTests") == 0, "Tests failed or result missing"
          assert d.get("result") == "Passed", "Test run did not pass"
          if sys.argv[2] == "true":
              assert d.get("totalTestCount") == 1 and d.get("passedTests") == 1, "Expected exactly one core startup test"
              expected = "CoreStartupTests/testIsolatedAppleCoreStartsAfterRejectedConfigurationAndStops"
              def identifiers(value):
                  if isinstance(value, dict):
                      yield value.get("nodeIdentifier")
                      for child in value.values(): yield from identifiers(child)
                  elif isinstance(value, list):
                      for child in value: yield from identifiers(child)
              with open(sys.argv[3]) as file: tree=json.load(file)
              assert any(item in (expected, expected+"()") for item in identifiers(tree)), "Core startup case was not executed"
          PY

      - name: Encrypt
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          OUTDIR="$RUNNER_TEMP/tests-out"
          mkdir -p "$RUNNER_TEMP/tout"
          mkdir -p "$OUTDIR"
          (cd "$OUTDIR" && tar czf "$RUNNER_TEMP/ios-tests.tgz" .)
          "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY \
            -in "$RUNNER_TEMP/ios-tests.tgz" -out "$RUNNER_TEMP/tout/ios-tests.tgz.enc"
          ls "$RUNNER_TEMP/tout" | sed 's/.*/artifact: &/'
          # Small encrypted first-pass evidence avoids downloading both xcresult bundles.
          python3 - "$OUTDIR" "$RUNNER_TEMP/ios-summary.tgz" <<'PY_SUMMARY'
          from pathlib import Path
          import sys,tarfile
          root=Path(sys.argv[1])
          with tarfile.open(sys.argv[2],"w:gz") as archive:
              for name in ("tests.log","summary.json","tests.json","dns-asan-summary.json","counts.txt"):
                  path=root/name
                  if path.is_file(): archive.add(path,arcname=name)
              if (root/"crashes").is_dir(): archive.add(root/"crashes",arcname="crashes")
          PY_SUMMARY
          mkdir -p "$RUNNER_TEMP/summary-out"
          "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY \
            -in "$RUNNER_TEMP/ios-summary.tgz" -out "$RUNNER_TEMP/summary-out/ios-summary.tgz.enc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easytier-ios-tests-encrypted
          path: ${{ runner.temp }}/tout/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easytier-ios-summary-encrypted
          path: ${{ runner.temp }}/summary-out/
          retention-days: 3
