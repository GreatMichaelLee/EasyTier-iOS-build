name: Strict DNS regression
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private harness source commit
        required: true
      core_ref:
        description: Private core source commit under test
        required: true
permissions:
  contents: read
jobs:
  ios-dns:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GreatMichaelLee/Easytier-iOS-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: GreatMichaelLee/Easytier
          ref: ${{ inputs.core_ref }}
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          persist-credentials: false
          path: core
      - name: DNS only on iOS Simulator
        run: |
          set +e
          (
            set -euo pipefail
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            rustup default 1.95
            rustup target add aarch64-apple-ios-sim
            command -v protoc >/dev/null 2>&1 || brew install protobuf
            python3 harness/ci_scripts/dns-regression/run.py --core "$GITHUB_WORKSPACE/core" --out "$RUNNER_TEMP/dns" --target aarch64-apple-ios-sim --runner iossim
          ) > "$RUNNER_TEMP/dns-run.log" 2>&1
          DNS_RC=$?
          echo "rc=$DNS_RC" >> "$RUNNER_TEMP/dns-run.log"
          if [ "$DNS_RC" = 0 ]; then echo 'DNS tests passed'; else echo 'DNS tests failed; encrypted diagnostics retained'; fi
          exit "$DNS_RC"
      - name: Encrypt DNS results
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/dns" "$RUNNER_TEMP/encrypted"
          cp "$RUNNER_TEMP/dns-run.log" "$RUNNER_TEMP/dns/run.log"
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'dns-result.tgz','w:gz') as archive:
              for name in ['run.log','cargo.log','tests.log','summary.json']:
                  p=root/'dns'/name
                  if p.is_file():archive.add(p,arcname=name)
          PY
          "$(brew --prefix openssl@3)/bin/openssl" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/dns-result.tgz" -out "$RUNNER_TEMP/encrypted/dns-result.tgz.enc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-dns-ios-simulator-encrypted
          path: ${{ runner.temp }}/encrypted/
          retention-days: 3
